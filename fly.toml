# Allsvenskantipset på Fly.io
app = "allsvenskantipset"
primary_region = "arn" # Stockholm

[build]
  [build.args]
    # Publik nyckel för pushnotiser (inte hemlig – den privata ligger i fly secrets)
    NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BF0TeENTp-xJa11ORLmPqkMueIDWaCODzVJQuhydXO7B66L_Rmh81xy5Fm21dxOkJZ-I6qjUHiKYT7wJ5afpuEM"

[env]
  DATABASE_URL = "file:/data/tipset.db"
  NODE_ENV = "production"
  TRUSTED_IP_HEADER = "fly-client-ip"

# SQLite-databasen ligger på en egen disk som överlever omstarter och nya deployer
[mounts]
  source = "tipset_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # En maskin som alltid är igång: SQLite på en volym, och schemaläggaren hämtar tabellen varje timme
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/logga-in"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
